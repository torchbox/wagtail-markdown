[tox]
min_version = 4.22

envlist =
    python{3.10,3.11}-django5.2-wagtail{7.0}
    python{3.12,3.13,3.14}-django{5.2,6.0}-wagtail{7.4}
    python{3.14}-django{5.2,6.1}-wagtail{8.0}

[gh-actions]
python =
    3.10: python3.10
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14

[testenv]
package = wheel
wheel_build_env = .pkg
use_frozen_constraints = true
constrain_package_deps = true

pass_env =
    FORCE_COLOR
    NO_COLOR

setenv =
    PYTHONPATH = {toxinidir}
    DJANGO_SETTINGS_MODULE = tests.testapp.settings
    PYTHONDEVMODE = 1
    # use the Python 3.12+ sys.monitoring
    python3.12: COVERAGE_CORE=sysmon
    python3.13: COVERAGE_CORE=sysmon
    python3.14: COVERAGE_CORE=sysmon

extras = testing

deps =
    django5.2: Django>=5.2,<5.3
    django6.0: Django>=6.0,<6.1
    django6.1: Django>=6.1,<6.2
    wagtail7.0: wagtail>=7.0,<7.1
    wagtail7.4: wagtail>=7.4,<7.5
    wagtail8.0: wagtail>=8.0,<8.1

install_command = python -m pip install -U {opts} {packages}
commands =
    python -m coverage run {toxinidir}/tests/manage.py test {posargs: -v 2}

[testenv:coverage-report]
base_python = python3.14
package = skip
deps =
    coverage>=7.0,<8.0
commands =
    python -Im coverage combine
    python -Im coverage report -m

[testenv:wagtailmain]
description = Test with latest Wagtail main branch
base_python = python3.14
deps =
    coverage>=7.0,<8.0
    wagtailmain: git+https://github.com/wagtail/wagtail.git@main#egg=Wagtail

[testenv:interactive]
description = An interactive environment for local testing purposes
base_python = python3.14

; Note: the following are commented out for development convenience,
;       so as to test the interactive mode with a different Wagtail version
; deps =
;     wagtail>=7.4,<8.0

commands_pre =
    python {toxinidir}/tests/manage.py makemigrations --settings=testapp.settings
    python {toxinidir}/tests/manage.py migrate --settings=testapp.settings
    python {toxinidir}/tests/manage.py shell -c "from django.contrib.auth.models import User;(not User.objects.filter(username='admin').exists()) and User.objects.create_superuser('admin', 'super@example.com', 'changeme')" --settings=testapp.settings
    python {toxinidir}/tests/manage.py createcachetable --settings=testapp.settings

commands =
    {posargs:python {toxinidir}/tests/manage.py runserver 127.0.0.1:8020 --settings=testapp.settings}

setenv =
    INTERACTIVE = 1
